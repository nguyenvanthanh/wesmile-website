<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <!-- Primary SEO Meta Tags -->
    <title>WeSmile - Professional Teeth Whitening Kit | WeSmile Teeth Whitening</title>
    <meta name="description" content="WeSmile offers professional teeth whitening kits trusted by dentists worldwide. Shop the WeSmile Kit for advanced at-home teeth whitening with clinically proven results. FDA approved WeSmile teeth whitening products." />
    <meta name="keywords" content="wesmile, wesmile kit, wesmile teeth whitening, teeth whitening kit, professional teeth whitening, at-home teeth whitening, dental care, WeSmile Pro, whitening kit" />
    <meta name="author" content="WeSmile" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://wesmilecare.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://wesmilecare.com/" />
    <meta property="og:title" content="WeSmile - Professional Teeth Whitening Kit | WeSmile Teeth Whitening" />
    <meta property="og:description" content="WeSmile offers professional teeth whitening kits trusted by dentists worldwide. Shop the WeSmile Kit for advanced at-home teeth whitening with clinically proven results." />
    <meta property="og:image" content="https://wesmilecare.com/logo-wesmile.png" />
    <meta property="og:site_name" content="WeSmile" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://wesmilecare.com/" />
    <meta name="twitter:title" content="WeSmile - Professional Teeth Whitening Kit | WeSmile Teeth Whitening" />
    <meta name="twitter:description" content="WeSmile offers professional teeth whitening kits trusted by dentists worldwide. Shop the WeSmile Kit for advanced at-home teeth whitening." />
    <meta name="twitter:image" content="https://wesmilecare.com/logo-wesmile.png" />

    <!-- Additional SEO -->
    <meta name="theme-color" content="#0891B2" />
    <meta name="apple-mobile-web-app-title" content="WeSmile" />
    <meta name="application-name" content="WeSmile" />

    <!-- Structured Data - Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "WeSmile",
      "url": "https://wesmilecare.com",
      "logo": "https://wesmilecare.com/logo-wesmile.png",
      "description": "WeSmile offers professional teeth whitening kits and dental care products trusted by dentists and patients worldwide.",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "7162 83RD DR E",
        "addressLocality": "Bradenton",
        "addressRegion": "FL",
        "postalCode": "34201-2152",
        "addressCountry": "US"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+1-773-237-8855",
        "contactType": "customer service",
        "email": "support@wesmilecare.com"
      },
      "sameAs": []
    }
    </script>

    <!-- Structured Data - WebSite (for sitelinks search box) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "WeSmile",
      "url": "https://wesmilecare.com",
      "description": "Professional WeSmile teeth whitening kits and dental care products. Shop the WeSmile Kit for at-home teeth whitening.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://wesmilecare.com/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Structured Data - Product (WeSmile Kit) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Product",
      "name": "WeSmile Pro Wireless Teeth Whitening Kit",
      "description": "Professional-grade WeSmile teeth whitening kit with wireless LED technology. The WeSmile Kit delivers dentist-level whitening results at home.",
      "brand": {
        "@type": "Brand",
        "name": "WeSmile"
      },
      "offers": {
        "@type": "Offer",
        "price": "49.00",
        "priceCurrency": "USD",
        "availability": "https://schema.org/InStock",
        "url": "https://wesmilecare.com/product/60005"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.8",
        "reviewCount": "1250"
      }
    }
    </script>

    <!-- Preconnect to external domains for faster loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />

    <!-- Fonts with display=swap for non-blocking load -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <link rel="icon" type="image/webp" href="/favicon.webp" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
